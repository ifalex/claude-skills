# dev (SIT) overlay — apply with:  -f values.yaml -f values-dev.yaml
# Only DIFFS from the common values.yaml belong here.

replicaCount: 1

# pullPolicy is Always from the base values (best practice). If your dev cluster
# runs locally-loaded images (kind/minikube) not in a registry, set:
# image:
#   pullPolicy: IfNotPresent

# Use a small preset instead of explicit resources in dev.
resources: {}
resourcesPreset: "nano"

podAntiAffinityPreset: ""   # single replica, no spreading needed

autoscaling:
  enabled: false

pdb:
  create: false

# Keep the same permissive NetworkPolicy as the base (allow-all) so dev matches
# the prod security shape and passes kube-score; tighten in uat/prod if desired.
networkPolicy:
  enabled: true
  allowExternal: true

ingress:
  enabled: false
  # if exposing in dev, prefer self-signed:
  # tls: true
  # selfSigned: true

# Example: chattier logging in dev
# extraEnvVars:
#   - name: LOG_LEVEL
#     value: debug

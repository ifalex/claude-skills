{{- /*
Auto-generate path. Emit ONLY when the user chose "auto-generate" secrets AND did not
supply an existingSecret. When existingSecret is used, do NOT emit this file — the chart
references the externally-managed Secret by name instead.

Pattern: preserve an already-generated password across upgrades via lookup, so
`helm upgrade` does not rotate it. Customize keys to the app's needs.
*/ -}}
{{- if and .Values.auth .Values.auth.create (not .Values.auth.existingSecret) }}
{{- $secretName := include "CHARTNAME.fullname" . }}
{{- $existing := (lookup "v1" "Secret" (include "CHARTNAME.namespace" .) $secretName) }}
{{- $password := "" }}
{{- if $existing }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = .Values.auth.password | default (randAlphaNum 16) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ include "CHARTNAME.namespace" . | quote }}
  labels: {{- include "CHARTNAME.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
{{- end }}

{{- /* Emit ONLY for StatefulSet workloads (provides stable pod DNS). Skip for Deployment/DaemonSet. */ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "CHARTNAME.fullname" . }}-headless
  namespace: {{ include "CHARTNAME.namespace" . | quote }}
  labels: {{- include "CHARTNAME.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    {{- range $name, $port := .Values.service.ports }}
    - name: {{ $name }}
      port: {{ $port }}
      targetPort: {{ $name }}
      protocol: TCP
    {{- end }}
  selector: {{- include "CHARTNAME.selectorLabels" . | nindent 4 }}
